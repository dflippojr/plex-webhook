name: SonarCloud

# SonarCloud analysis on GitHub-hosted runners, for pull requests and pushes to
# master. The quality gate is informational for now (no sonar.qualitygate.wait),
# so this check only fails if the scan itself errors.
#
# sonar-project.properties stays set up for the tower-local SonarQube scan;
# the SonarCloud project key and organization are passed as scanner arguments
# here instead. SONAR_TOKEN must exist in Actions secrets for ordinary runs
# and in Dependabot secrets for dependency PRs. A missing token produces a
# notice, not an analysis result. The offline pytest suite runs first; its
# coverage.xml is handed to the scan through sonar.python.coverage.reportPaths.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: >-
          pip install --require-hashes --only-binary :all: -r requirements-dev.lock

      - name: Run tests
        run: pytest --cov=app --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  sonar:
    needs: tests
    runs-on: ubuntu-latest
    # Forks cannot access secrets. Same-repository PRs, including Dependabot,
    # may scan; GitHub supplies Dependabot secrets for Dependabot-triggered runs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Never execute repository code in this job: it has access to SONAR_TOKEN.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage

      - name: Note missing token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SONAR_TOKEN is absent from the triggering actor's secret store; SonarCloud analysis did not run. Configure Actions and Dependabot secrets separately."
          echo "### SonarCloud analysis did not run" >> "$GITHUB_STEP_SUMMARY"
          echo 'The scan was skipped because SONAR_TOKEN is absent. This green workflow is not evidence of analysis or a passing quality gate. Add SONAR_TOKEN to the repository Actions and Dependabot secret stores, then rerun the applicable workflow.' >> "$GITHUB_STEP_SUMMARY"

      - name: Scan with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=dflippojr
            -Dsonar.projectKey=dflippojr_plex-webhook
            -Dsonar.python.coverage.reportPaths=coverage.xml
