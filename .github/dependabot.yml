version: 2
updates:
  - package-ecosystem: pip
    assignees:
      - dflippojr
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    assignees:
      - dflippojr
    directory: /
    schedule:
      interval: weekly
    # Hold the Python 3.15 base image: PyYAML has no cp315 wheel yet, so the
    # locked dependencies can't install with --only-binary. Drop this ignore
    # once PyYAML publishes Python 3.15 wheels. See #119.
    ignore:
      - dependency-name: "python"
        versions: [">=3.15"]

  - package-ecosystem: github-actions
    assignees:
      - dflippojr
    directory: /
    schedule:
      interval: weekly
