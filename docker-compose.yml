networks:
  monitoring:
    external: true
    name: observability-stack_monitoring

services:
  plex-webhook:
    build: .
    container_name: plex-webhook
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3);
          assert response.status == 200
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    env_file: .env
    ports:
      - "127.0.0.1:9800:8000"
    volumes:
      - ./data:/data
      - ./config:/config:ro
    networks:
      - monitoring
