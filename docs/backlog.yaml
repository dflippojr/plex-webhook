# Roadmap items mirrored to GitHub issues by scripts/sync_backlog_issues.py.
#
# key:    stable id; written into the issue body as <!-- backlog: key --> so reruns never file duplicates
# kind:   check (verify something already built) | deferred (part of a built phase) | feature (not scheduled)
# phase:  optional; the phase an item is planned for
# status: optional; `done` marks finished work. Done items stay in this file as history,
#         with `issue:` set to the closed issue's number, and the script never files them.
#         Mark an item done (and add its issue number) when its issue closes.
#         Bodies of done items are kept as originally filed; the issue is the record.
#
# The script only creates missing issues. It never edits or closes existing ones.

items:
  - key: wire-rooms-and-credentials
    kind: check
    title: "Wire live rooms.yaml and device credentials, then dim on real playback"
    body: |
      Phase 3 controllers exist, but live mapping and credentials are still the SETUP.md
      placeholders. No agent can finish this; it needs the physical devices and the
      owner's accounts.

      Remaining owner steps (Govee API key is already obtained):
      - enable LAN Control on each Govee device and note its SKU
      - create a Tuya IoT Platform cloud project, link the Smart Life/Tuya app, and run
        `tinytuya wizard` for device id / local_key / ip
      - copy the committed `.example` files to gitignored `.env`,
        `config/devices.secrets.yaml`, and `config/rooms.yaml`, then fill real values
      - play something on each mapped Plex client, read `title`/`uuid` from `GET /clients`,
        and put those identifiers in the local rooms file
      - rebuild/restart the container so env and secrets are picked up

      Exit test: play on a mapped client and confirm that room's lights dim; pause/stop
      the last client in that room and confirm they restore. Keep real UUIDs, device ids,
      and local keys out of git — the repo is public.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: verify-govee-lan
    kind: check
    title: "Verify Govee LAN control against a real bulb"
    body: |
      `GoveeController` tries UDP LAN control first and falls back to the Govee Cloud API.
      The LAN path is based on community reverse-engineering (`govee_led_wez` /
      `python-govee-led` / `govee-lan-api`) and has not been run against real hardware.

      Protocol as implemented:
      - multicast scan to 239.255.255.250:4001
      - replies on UDP 4002
      - unicast turn/brightness commands on UDP 4003

      After rooms and credentials are wired, confirm LAN discovery (or a pinned static
      `ip` in `config/devices.secrets.yaml`) actually drives a real bulb. If LAN fails
      and cloud works, record the failure (VLAN, AP isolation, Docker network, unsupported
      SKU) and fix `_discover_ip` / `_send_lan_command` rather than silently staying on
      cloud. Cloud fallback still needs `model` (SKU) in rooms.yaml.

      Blocked on wiring live rooms and credentials.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: verify-tuya-dps
    kind: check
    title: "Verify Tuya/Gosund DPS indices against a real device"
    body: |
      `TuyaController` assumes firmware-specific datapoints that have not been checked
      against the owner's Gosund/Tuya hardware:
      - local tinytuya: DPS `3` for brightness, scale 10–1000
      - cloud: `switch_1` plus `bright_value_v2`

      These codes vary by device and firmware. After `tinytuya wizard` keys are in
      `config/devices.secrets.yaml`, dim/restore a real device and confirm both local
      and cloud paths. If a command is a no-op or errors, inspect that device's DPS map
      and adjust the small `set_value` / `sendcommand` calls in `app/lights.py` rather
      than rewriting the hybrid controller.

      Blocked on wiring live rooms and credentials.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: persist-event-counters
    kind: deferred
    status: done
    issue: 5  # PR #10
    title: "Seed Prometheus event counters from SQLite after a restart"
    body: |
      Startup reloads `plex_webhook_last_event_timestamp_seconds` from SQLite
      and reports 0 for every configured room so Grafana does not keep a stale
      pre-restart value. Event counters (`plex_webhook_events_total` and the Total /
      Cumulative dashboard panels) started at zero whenever the container restarted.

      Seed those counters from the `events` table the same way the timestamp gauge is
      seeded, grouped by the existing labels (`event`, `player`, `account`). Keep the
      Grafana dashboard on `increase()`-based 24h/rate panels; do not switch them to raw
      cumulative counters. A restart should not look like a wipe of historical volume.

      Built in #5 (PR #10): startup seeds the counters from the `events` table.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: sonarcloud-public-ci
    kind: feature
    status: done
    issue: 7  # PR #12
    title: "Add SonarCloud analysis on GitHub-hosted public CI"
    body: |
      Tower-local SonarQube already scans this repo (`sonar-project.properties`,
      `scan.ps1`). GitHub-hosted Actions for this public repo should not talk to the
      homelab SonarQube.

      Decided and built (#7, PR #12): analysis runs on every pull request and every push
      to `master`; the quality gate is informational. See the README "Code analysis"
      section.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: retire-events-jsonl
    kind: deferred
    status: done
    issue: 183
    title: "Retire the duplicate events.jsonl raw capture now that SQLite stores every event"
    body: |
      Every accepted webhook was stored twice: a line in `events.jsonl` and an `events`
      row in SQLite. Owner decision (option (a)): stop writing the log and keep the
      attachment metadata in a new nullable `events.attachments` column.

      Built in #183 (stages 1 and 2): the column is written with every row and no
      `events.jsonl` is created. `audit_cli prune` still trims an existing log; removing
      that code is `remove-events-jsonl-prune`.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: remove-events-jsonl-prune
    kind: deferred
    title: "Remove the events.jsonl pruning code one release after the log stopped being written"
    body: |
      #183 stopped writing `events.jsonl`; `audit_cli prune` still trims a log left by an
      earlier release so its old lines age out. One release later, remove
      `prune_event_log`, the `--events-log` option, the `event_log_eligible` and
      `event_log_removed` output fields and their tests, and update `docs/audit.md`
      "Retention maintenance" and the README Phase 1 section.

      Deleting the log-pruning tests needs the owner's `gate-change-approved` label. Removing
      covered code can lower the coverage percentage, so check the total against
      `fail_under` in `.coveragerc` first.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: sqlite-wal-migrations
    kind: feature
    status: done
    issue: 180
    title: "Storage: SQLite WAL and versioned migrations"
    body: |
      From the 2026-11-17 architecture review. The database ran in rollback-journal
      mode, so an open reader (the audit CLI, a backup) made audit appends fail after
      250 ms and webhook inserts fail after 5 s. Schema checks ran on hot paths and no
      schema version was recorded.

      Built in #180 (stages 1 and 2): `app/storage.py` switches the file to WAL at
      startup and applies numbered migrations recorded in `PRAGMA user_version`;
      per-call connections run no DDL. Stage 3 is `online-retention`.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: online-retention
    kind: deferred
    title: "Prune stored events and audit rows without stopping the service"
    body: |
      Stage 3 of #180. `audit_cli prune --apply` tells the owner to stop the service
      first. Under WAL its database part no longer needs that: readers never block, and
      the service's writers wait for the prune's write lock (the audit append only
      250 ms, so a long prune could still drop audit records). Decide whether to allow
      an online prune, for example by deleting in small batches, then update
      `docs/audit.md` "Retention maintenance" and the CLI's `--apply` help.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: light-controller-contract
    kind: deferred
    status: done
    issue: 184
    title: "Light controllers: declare the contract and make the test fakes honor it"
    body: |
      From the 2026-11-17 architecture review. The light-controller contract was implicit:
      each controller was duck-typed, so test doubles drifted from it and production code
      grew tolerance for them.

      Built in #184 (stage 1): `app/lights.py` declares the `LightController` Protocol, and
      the `light_calls` fake and the other apply_action fakes return LightResult lists.
      Stages 2 and 3 are `light-controller-cleanup`.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: light-controller-cleanup
    kind: deferred
    title: "Delete the light tolerance code, the test-only functions and the unreachable expiry branch"
    body: |
      Stages 2 and 3 of #184. Stage 1 (the `LightController` Protocol and honest fakes) is built.

      - Stage 2: delete the non-list result checks in `app/dispatcher.py` (`_dim`, `_restore`,
        `_apply`) and `_attempt_of` in `app/lights.py`. Move any test that patches a transport
        step to return a bool so it returns an `Attempt`.
      - Stage 3: delete `db.event_counts`, `GoveeController._discover_ip`,
        `dispatcher._client_id` and `ActionQueue.pending`, and move their tests to the public
        paths that exercise the same behaviour (`labeled_event_counts`, `prepare` and
        `_resolve`, `ActionQueue.submit` futures). Simplify `expire_idle_clients` to the
        one-entry-per-room invariant, which removes the unreachable `if not active:` arc.

      Both stages delete tests, so they need the owner's `gate-change-approved` label. Check
      the coverage total against `fail_under` in `.coveragerc` first: deleting covered code can
      lower the percentage, so cover a miss before deleting.

      Do not put real paths, logins, tokens, or tailnet names in public comments.
