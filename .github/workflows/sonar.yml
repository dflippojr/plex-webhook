name: SonarCloud

# SonarCloud analysis on GitHub-hosted runners, for pull requests and pushes to
# master. The quality gate is informational for now (no sonar.qualitygate.wait),
# so this check only fails if the scan itself errors.
#
# sonar-project.properties stays set up for the tower-local SonarQube scan;
# the SonarCloud project key and organization are passed as scanner arguments
# here instead. The scan is skipped until the SONAR_TOKEN repository secret
# exists. The offline pytest suite runs first; its coverage.xml is handed to
# the scan through sonar.python.coverage.reportPaths.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  sonar:
    needs: tests
    runs-on: ubuntu-latest
    # Secrets are not passed to pull requests from forks; skip rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Note missing token
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN secret is not set; skipping the SonarCloud scan."

      - name: Scan with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=dflippojr
            -Dsonar.projectKey=dflippojr_plex-webhook
            -Dsonar.python.coverage.reportPaths=coverage.xml
